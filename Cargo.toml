[package]
name = "bluetooth-mixer"
version = "0.1.0"
edition = "2021"
description = "Web-controlled Bluetooth audio mixer built on PipeWire/WirePlumber"

[[bin]]
name = "bluetooth-mixer"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "ws", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "sync", "time", "signal", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
# tls-rustls-no-provider: we install the ring provider ourselves rather than
# pulling in aws-lc-rs, which wants a C toolchain and cmake to build.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
# v0_3_44 exposes `keys::TARGET_OBJECT`, which the capture stream uses to aim
# at the null sink's monitor ports.
pipewire = { version = "0.10", features = ["v0_3_44"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
