[package]
name = "bluetooth-mixer"
version = "0.1.0"
edition = "2021"
description = "Web-controlled Bluetooth audio mixer built on PipeWire/WirePlumber"

[[bin]]
name = "bluetooth-mixer"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "ws", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true